<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactor Core - Chaos Mode</title>
    <style>
        :root {
            --rychlost: 5s; 
            --barva-zlata: rgba(0, 130, 0, 0.50);
            --barva-tecek: rgba(0, 85, 0, 0.40);
            --velikost-mrizky: 75.6px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #050505;
            display: flex; justify-content: center; align-items: center;
        }

        .dots-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: radial-gradient(var(--barva-tecek) 1px, transparent 0);
            background-size: 4px 4px;
            z-index: 1;
        }

        .grid-layer {
            position: absolute;
            top: calc(var(--velikost-mrizky) * -1);
            left: calc(var(--velikost-mrizky) * -1);
            width: calc(100% + (var(--velikost-mrizky) * 2));
            height: calc(100% + (var(--velikost-mrizky) * 2));
            background-image: 
                linear-gradient(to right, var(--barva-zlata) 1px, transparent 1px),
                linear-gradient(to bottom, var(--barva-zlata) 1px, transparent 1px);
            background-size: var(--velikost-mrizky) var(--velikost-mrizky);
            animation: slideGrid var(--rychlost) linear infinite;
            z-index: 2;
        }

        .logo-container {
            position: relative;
            z-index: 10;
            width: 800px; /* Ještě o kousek větší pro lepší efekt */
            max-width: 90vw;
            pointer-events: none;
        }

        .logo-img {
            width: 100%; height: auto;
            display: block;
            filter: drop-shadow(0 0 15px rgba(27, 117, 0, 0.137));
            transition: all 0.03s; /* Extrémně rychlá odezva */
        }

        /* --- GLITCH VARIACE --- */
        .g-heavy { transform: translate(-20px, 15px) skew(15deg); clip-path: inset(10% 0 70% 0); filter: invert(1) hue-rotate(90deg); }
        .g-slice { transform: translate(20px, -10px); clip-path: inset(50% 0 10% 0); opacity: 0.5; }
        .g-zoom { transform: scale(1.1); filter: brightness(3); clip-path: inset(0 40% 0 40%); }
        .g-shake { transform: translate(5px, 5px); }

        @keyframes slideGrid {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--velikost-mrizky), var(--velikost-mrizky)); }
        }
    </style>
</head>
<body>

    <div class="dots-layer"></div>
    <div class="grid-layer"></div>

    <div class="logo-container">
        <img src="startup.png" id="logo" class="logo-img" alt="Reactor Logo">
    </div>

    <script>
        const logo = document.getElementById('logo');
        const effects = ['g-heavy', 'g-slice', 'g-zoom', 'g-shake'];

        function triggerSingleGlitch() {
            const effect = effects[Math.floor(Math.random() * effects.length)];
            logo.classList.add(effect);
            
            // Doba trvání jednoho záškubu (50-100ms)
            setTimeout(() => {
                logo.classList.remove(effect);
            }, Math.random() * 50 + 50);
        }

        function mainLoop() {
            // Rozhodne, jestli přijde normální glitch nebo "šílená sekvence"
            const chance = Math.random();

            if (chance > 0.85) { 
                // ŠÍLENÁ SEKUNDA (Burst mode)
                let count = 0;
                const burstInterval = setInterval(() => {
                    triggerSingleGlitch();
                    count++;
                    if (count > 15) clearInterval(burstInterval); // Po 15 záškubech konec
                }, 60); // Kadence záškubů v burstu
                
                setTimeout(mainLoop, Math.random() * 4000 + 2000);
            } else {
                // NORMÁLNÍ GLITCH
                triggerSingleGlitch();
                setTimeout(mainLoop, Math.random() * 5000 + 500);
            }
        }

        // Start systému
        mainLoop();
    </script>

</body>
</html>
